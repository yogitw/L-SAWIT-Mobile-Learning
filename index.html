<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-SAWIT PRO - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, collection, onSnapshot, query };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                award: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></svg>,
                chevron: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>,
                play: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 8 8 4-8 4Z"/></svg>,
                check: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
                user: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
                back: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
                book: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>,
                trophy: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            };
            return icons[name] || null;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('landing');
            const [userRole, setUserRole] = useState(null);
            const [points, setPoints] = useState(0);
            const [selectedModule, setSelectedModule] = useState(null);
            const [examMode, setExamMode] = useState(false);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [quizFeedback, setQuizFeedback] = useState(null);
            const [showCertificate, setShowCertificate] = useState(false);
            const [completedModules, setCompletedModules] = useState([]);
            
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [adminData, setAdminData] = useState([]);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'lsawit-pro-v4';

            const roles = [
                { id: 'mandor1', title: 'Mandor 1', desc: 'Supervisi Lapangan' },
                { id: 'krani1', title: 'Krani 1', desc: 'Admin Utama Afdeling' },
                { id: 'mandorpanen', title: 'Mandor Panen', desc: 'Manajemen Pemanen' },
                { id: 'globaltelling', title: 'Global Telling', desc: 'Sensus Produksi' },
                { id: 'akp', title: 'Petugas AKP', desc: 'Kerapatan Panen' },
                { id: 'kapinsp', title: 'KAP Inspeksi', desc: 'Audit Mutu & Ancak' },
                { id: 'kranicek', title: 'Krani Cek', desc: 'Administrasi TPH' },
                { id: 'kraniprod', title: 'Krani Produksi', desc: 'Rekap Hasil Panen' },
            ];

            const generateQuestions = (roleId, baseTopic) => {
                return Array.from({ length: 20 }, (_, i) => ({
                    id: `${roleId}_q${i+1}`,
                    question: `Soal No ${i+1}: Apa tindakan wajib saat terjadi penyimpangan pada ${baseTopic}?`,
                    options: [`Abaikan sementara`, `Laporkan ke asisten (Benar)`, `Diskusikan esok hari`],
                    correct: 1,
                    pts: 10
                }));
            };

            const learningContent = {
                mandor1: "Materi Mandor 1 meliputi pengawasan rotasi panen, pemeliharaan piringan, dan pemupukan tepat waktu. Fokus pada kualitas supervisi mandor di lapangan sesuai SOP PTPN.",
                krani1: "Materi Krani 1 berfokus pada administrasi data afdeling, input buku saku ke sistem, dan validasi data produksi harian sebelum dikirim ke kantor kebun.",
                mandorpanen: "Teknis organisasi panen: Kriteria Matang Panen (KMP), penempatan ancak, dan pengaturan transportasi TBS agar tidak restan lebih dari 24 jam.",
                globaltelling: "Metode sensus 4 bulanan untuk memprediksi produksi. Menghitung bunga betina, buah muda, dan buah hitam pada pokok sampel tertentu.",
                akp: "Angka Kerapatan Panen (AKP). Menentukan jumlah pemanen yang dibutuhkan berdasarkan hasil sensus buah matang satu hari sebelum panen.",
                kapinsp: "KAP (Kualitas Ancak & Produksi). Melakukan audit mutu petak, menghitung brondolan tinggal, dan memastikan buah dipanen sesuai standar kematangan.",
                kranicek: "Administrasi TPH. Verifikasi nomor pemanen, nomor TPH, dan berat bersih TBS sebelum dimuat ke truk/angkutan.",
                kraniprod: "Rekapitulasi Produksi Kebun. Mengelola data timbangan, menghitung rendemen sementara, dan menyusun laporan produksi harian.",
            };

            const modulesData = useMemo(() => ({
                mandor1: [{ id: 'm1_full', title: 'Sertifikasi Mandor 1', category: 'Lengkap', content: learningContent.mandor1, questions: generateQuestions('m1', 'Supervisi Lapangan') }],
                krani1: [{ id: 'k1_full', title: 'Sertifikasi Krani 1', category: 'Lengkap', content: learningContent.krani1, questions: generateQuestions('k1', 'Administrasi SAP') }],
                mandorpanen: [{ id: 'mp_full', title: 'Sertifikasi Mandor Panen', category: 'Lengkap', content: learningContent.mandorpanen, questions: generateQuestions('mp', 'Manajemen Panen') }],
                globaltelling: [{ id: 'gt_full', title: 'Sertifikasi Global Telling', category: 'Lengkap', content: learningContent.globaltelling, questions: generateQuestions('gt', 'Sensus Produksi') }],
                akp: [{ id: 'akp_full', title: 'Sertifikasi Petugas AKP', category: 'Lengkap', content: learningContent.akp, questions: generateQuestions('akp', 'Kerapatan Panen') }],
                kapinsp: [{ id: 'kap_full', title: 'Sertifikasi KAP Inspeksi', category: 'Lengkap', content: learningContent.kapinsp, questions: generateQuestions('kap', 'Audit Mutu') }],
                kranicek: [{ id: 'kc_full', title: 'Sertifikasi Krani Cek', category: 'Lengkap', content: learningContent.kranicek, questions: generateQuestions('kc', 'Verifikasi TPH') }],
                kraniprod: [{ id: 'kp_full', title: 'Sertifikasi Krani Produksi', category: 'Lengkap', content: learningContent.kraniprod, questions: generateQuestions('kp', 'Rekap Produksi') }],
            }), []);

            const currentModules = modulesData[userRole] || [];

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FirebaseSDK) return;
                    const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const firestore = getFirestore(app);
                    setDb(firestore);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, setUser);
                };
                setTimeout(initFirebase, 500);
            }, []);

            useEffect(() => {
                if (!db || !user || currentPage !== 'admin') return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                return onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'user_results'), (s) => {
                    setAdminData(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
            }, [db, user, currentPage]);

            const saveProgress = async (finalScore, moduleId) => {
                if (!db || !user) return;
                const { doc, setDoc } = window.FirebaseSDK;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_results', user.uid);
                await setDoc(docRef, {
                    uid: user.uid,
                    role: userRole,
                    points: points + finalScore,
                    completed: [...completedModules, moduleId],
                    lastUpdate: new Date().toISOString()
                }, { merge: true });
            };

            const handleAnswer = (idx) => {
                const currentQ = selectedModule.questions[currentQuestionIndex];
                const isCorrect = idx === currentQ.correct;
                
                if (isCorrect) {
                    setScore(s => s + 1);
                    setQuizFeedback('correct');
                } else {
                    setQuizFeedback('wrong');
                }

                setTimeout(() => {
                    setQuizFeedback(null);
                    if (currentQuestionIndex + 1 < selectedModule.questions.length) {
                        setCurrentQuestionIndex(i => i + 1);
                    } else {
                        const finalScore = score + (isCorrect ? 1 : 0);
                        finishExam(finalScore);
                    }
                }, 600);
            };

            const finishExam = (finalScore) => {
                if (finalScore >= 15) {
                    const bonusPoints = finalScore * 10;
                    setPoints(p => p + bonusPoints);
                    setCompletedModules(c => [...c, selectedModule.id]);
                    saveProgress(bonusPoints, selectedModule.id);
                    setShowCertificate(true);
                    setTimeout(() => {
                        setShowCertificate(false);
                        setCurrentPage('dashboard');
                    }, 3000);
                } else {
                    setCurrentPage('dashboard');
                }
                setExamMode(false);
                setCurrentQuestionIndex(0);
                setScore(0);
            };

            // VIEWS
            if (currentPage === 'landing') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-white text-center">
                        <div className="w-24 h-24 bg-emerald-600 rounded-[35px] flex items-center justify-center mb-8 shadow-[0_20px_50px_rgba(16,185,129,0.3)] animate-pulse">
                            <Icon name="award" className="w-12 h-12" />
                        </div>
                        <h1 className="text-4xl font-black italic tracking-tighter mb-2 uppercase">L-SAWIT <span className="text-emerald-500">PRO</span></h1>
                        <p className="text-slate-500 text-[10px] font-bold tracking-[0.4em] mb-12 uppercase">Digital Knowledge Center</p>
                        
                        <div className="w-full max-w-md grid grid-cols-1 gap-3 max-h-[45vh] overflow-y-auto pr-2 custom-scrollbar border-y border-white/5 py-6">
                            {roles.map(role => (
                                <button key={role.id} onClick={() => { setUserRole(role.id); setCurrentPage('dashboard'); }} className="group p-5 bg-slate-900/50 border border-white/5 rounded-[25px] flex items-center hover:bg-emerald-600 transition-all active:scale-95 text-left">
                                    <div className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center mr-4 group-hover:bg-white/20">
                                        <Icon name="user" className="w-6 h-6 text-emerald-500 group-hover:text-white" />
                                    </div>
                                    <div>
                                        <h3 className="font-black text-xs uppercase tracking-tight">{role.title}</h3>
                                        <p className="text-[9px] text-slate-500 group-hover:text-emerald-100 uppercase">{role.desc}</p>
                                    </div>
                                </button>
                            ))}
                        </div>

                        <button onClick={() => setCurrentPage('admin')} className="mt-10 px-6 py-3 border border-slate-800 rounded-full text-[10px] font-black uppercase text-slate-500 hover:text-white transition-all">Panel Monitoring PTPN</button>
                    </div>
                );
            }

            if (currentPage === 'dashboard') {
                const roleInfo = roles.find(r => r.id === userRole);
                return (
                    <div className="min-h-screen bg-slate-50 pb-12 animate-in">
                        <div className="bg-slate-950 p-10 rounded-b-[50px] text-white shadow-2xl relative">
                            <div className="flex justify-between items-center mb-10">
                                <div>
                                    <p className="text-emerald-500 text-[10px] font-black uppercase mb-1 tracking-widest">Jabatan</p>
                                    <h2 className="text-3xl font-black italic uppercase tracking-tighter">{roleInfo?.title}</h2>
                                </div>
                                <button onClick={() => setCurrentPage('landing')} className="p-3 bg-white/5 rounded-2xl"><Icon name="back" /></button>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white/5 p-6 rounded-[30px] border border-white/5">
                                    <p className="text-[9px] text-slate-400 font-bold uppercase mb-1">XP Saya</p>
                                    <p className="text-3xl font-black text-emerald-400">{points}</p>
                                </div>
                                <div className="bg-white/5 p-6 rounded-[30px] border border-white/5">
                                    <p className="text-[9px] text-slate-400 font-bold uppercase mb-1">Lulus</p>
                                    <p className="text-3xl font-black text-yellow-500">{completedModules.length}</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-8 space-y-4">
                            <h3 className="text-[11px] font-black uppercase text-slate-400 tracking-[0.2em] mb-6 flex items-center gap-2">
                                <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div> Materi & Sertifikasi
                            </h3>
                            {currentModules.map(mod => (
                                <div key={mod.id} className="bg-white p-6 rounded-[35px] border border-slate-100 flex items-center shadow-sm group">
                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 ${completedModules.includes(mod.id) ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>
                                        <Icon name={completedModules.includes(mod.id) ? "check" : "book"} className="w-7 h-7" />
                                    </div>
                                    <div className="ml-5 flex-1">
                                        <p className="text-[9px] font-black text-slate-400 uppercase mb-1">{mod.category} • MODUL</p>
                                        <h4 className="text-sm font-black uppercase text-slate-800 tracking-tight">{mod.title}</h4>
                                    </div>
                                    <button 
                                        onClick={() => { setSelectedModule(mod); setCurrentPage('player'); setExamMode(false); }}
                                        className="bg-slate-50 p-3 rounded-2xl group-hover:bg-emerald-500 group-hover:text-white transition-all"
                                    >
                                        <Icon name="chevron" className="w-5 h-5" />
                                    </button>
                                </div>
                            ))}
                        </div>

                        {showCertificate && (
                            <div className="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-8 backdrop-blur-xl">
                                <div className="bg-white rounded-[50px] p-12 w-full max-w-sm text-center animate-in shadow-2xl">
                                    <Icon name="trophy" className="w-16 h-16 text-yellow-500 mx-auto mb-6" />
                                    <h2 className="text-2xl font-black uppercase italic mb-2 tracking-tighter">SERTIFIKAT LULUS</h2>
                                    <p className="text-[11px] text-slate-500 font-bold uppercase mb-8 tracking-[0.2em]">Modul Berhasil Diselesaikan</p>
                                    <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-emerald-500 animate-[progress_3s_linear]"></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (currentPage === 'player') {
                return (
                    <div className="min-h-screen bg-slate-950 text-white flex flex-col animate-in">
                        <div className="p-6 flex items-center justify-between border-b border-white/5">
                            <button onClick={() => setCurrentPage('dashboard')} className="p-2 bg-white/5 rounded-xl"><Icon name="back" className="w-5 h-5" /></button>
                            <div className="text-center">
                                <p className="text-[10px] font-black text-emerald-500 uppercase tracking-widest">{examMode ? 'UJIAN KOMPETENSI' : 'MATERI PEMBELAJARAN'}</p>
                                <h3 className="text-xs font-black uppercase italic">{selectedModule.title}</h3>
                            </div>
                            <div className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center text-[11px] font-black">
                                {examMode ? `${currentQuestionIndex + 1}/20` : 'SOP'}
                            </div>
                        </div>

                        {!examMode ? (
                            <div className="flex-1 p-8 overflow-y-auto custom-scrollbar">
                                <div className="max-w-xl mx-auto py-10">
                                    <div className="aspect-video bg-slate-900 rounded-[40px] border border-white/10 flex flex-col items-center justify-center mb-10 group cursor-pointer hover:bg-slate-800 transition-all">
                                        <div className="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
                                            <Icon name="play" className="w-8 h-8 ml-1" />
                                        </div>
                                        <p className="mt-4 text-[10px] font-black uppercase text-slate-500 tracking-[0.3em]">Putar Video Panduan Teknis</p>
                                    </div>
                                    
                                    <div className="bg-white/5 p-8 rounded-[40px] border border-white/5">
                                        <h4 className="text-emerald-500 text-[10px] font-black uppercase mb-4 tracking-widest">Deskripsi SOP</h4>
                                        <p className="text-sm font-medium leading-relaxed text-slate-300 mb-8">{selectedModule.content}</p>
                                        <div className="p-5 bg-emerald-500/10 rounded-2xl border border-emerald-500/20 text-[11px] font-bold text-emerald-200">
                                            * Pelajari materi ini dengan saksama. Ujian kompetensi membutuhkan minimal 15 jawaban benar untuk lulus.
                                        </div>
                                    </div>

                                    <button 
                                        disabled={completedModules.includes(selectedModule.id)}
                                        onClick={() => setExamMode(true)}
                                        className="w-full mt-10 py-6 bg-emerald-600 text-white rounded-[30px] font-black uppercase text-[11px] tracking-widest shadow-xl hover:bg-emerald-500 active:scale-95 transition-all disabled:opacity-50 disabled:grayscale"
                                    >
                                        {completedModules.includes(selectedModule.id) ? 'Sudah Lulus Sertifikasi' : 'Mulai Ujian Sertifikasi'}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 p-8 flex flex-col justify-center max-w-lg mx-auto w-full">
                                <div className="mb-10 text-center">
                                    <div className="inline-block px-4 py-1.5 bg-emerald-500/10 text-emerald-500 rounded-full text-[9px] font-black uppercase tracking-[0.2em] mb-4">
                                        AKUMULASI SKOR: {score}
                                    </div>
                                    <h2 className="text-2xl font-black text-center uppercase italic leading-tight">{selectedModule.questions[currentQuestionIndex].question}</h2>
                                </div>

                                <div className="space-y-3">
                                    {selectedModule.questions[currentQuestionIndex].options.map((opt, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => handleAnswer(idx)}
                                            className={`w-full p-6 rounded-[30px] text-[11px] font-black uppercase text-left border-2 transition-all ${
                                                quizFeedback === 'correct' && idx === selectedModule.questions[currentQuestionIndex].correct ? 'bg-emerald-600 border-emerald-400' : 
                                                quizFeedback === 'wrong' && idx !== selectedModule.questions[currentQuestionIndex].correct ? 'bg-rose-900/50 border-white/5 opacity-50' : 
                                                'bg-white/5 border-white/5 hover:border-white/20'
                                            }`}
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-12 flex gap-1 h-1.5">
                                    {Array.from({ length: 20 }).map((_, i) => (
                                        <div key={i} className={`flex-1 rounded-full ${i <= currentQuestionIndex ? 'bg-emerald-500' : 'bg-white/5'}`}></div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (currentPage === 'admin') {
                return (
                    <div className="min-h-screen bg-slate-50 p-8 animate-in">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex justify-between items-center mb-10">
                                <button onClick={() => setCurrentPage('landing')} className="p-3 bg-slate-200 rounded-2xl"><Icon name="back" className="w-6 h-6 text-slate-700"/></button>
                                <h2 className="text-2xl font-black uppercase italic tracking-tighter">Monitoring <span className="text-emerald-600">Kompetensi PTPN</span></h2>
                            </div>
                            
                            <div className="bg-white rounded-[45px] shadow-sm border border-slate-100 overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 border-b border-slate-100 text-[11px] font-black uppercase text-slate-400">
                                        <tr>
                                            <th className="p-8">ID Peserta</th>
                                            <th className="p-8">Jabatan</th>
                                            <th className="p-8 text-center">Modul Lulus</th>
                                            <th className="p-8 text-right">Total XP</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {adminData.map(res => (
                                            <tr key={res.id} className="hover:bg-slate-50">
                                                <td className="p-8 font-mono text-xs font-bold">{res.uid?.substring(0,10)}...</td>
                                                <td className="p-8 text-xs font-black uppercase text-slate-800">{res.role}</td>
                                                <td className="p-8 text-center">
                                                    <span className="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-black">{res.completed?.length || 0} Lulus</span>
                                                </td>
                                                <td className="p-8 text-right font-black text-emerald-600 text-lg">{res.points || 0} XP</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
